[package]
name = "nanggroe-iot"
version = "1.0.0"
description = "Nanggroe IoT — IoT & Robotics Platform"
authors = ["Mulky Malikul Dhaher <mulkymalikuldhaher@email.com>"]
license = "MIT"
repository = "https://github.com/mulkymalikuldhrs/nanggroe-iot"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
