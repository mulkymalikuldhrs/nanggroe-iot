<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #ffffff;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    width: 1200px;
    padding: 40px 48px;
  }
  .title {
    font-size: 20px;
    font-weight: 700;
    color: #1e293b;
    text-align: center;
    margin-bottom: 20px;
    letter-spacing: 0.5px;
  }
  .subtitle {
    font-size: 12px;
    color: #64748b;
    text-align: center;
    margin-bottom: 24px;
  }
  .diagram-container {
    width: 1104px;
    margin: 0 auto;
    position: relative;
    height: 700px;
  }
  /* SVG schematic */
  svg.schematic {
    width: 100%;
    height: 100%;
  }
  .frame-label {
    font-size: 11px;
    fill: #64748b;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  .component-label {
    font-size: 12px;
    font-weight: 600;
    fill: #1e293b;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  .detail-label {
    font-size: 10px;
    fill: #64748b;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  .dim-label {
    font-size: 9px;
    fill: #94a3b8;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  .motor-label {
    font-size: 11px;
    font-weight: 700;
    fill: #1e293b;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  .rotation-label {
    font-size: 9px;
    fill: #64748b;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
</style>
</head>
<body>

<div class="title">Konfigurasi Tricopter — Tampak Atas</div>
<div class="subtitle">Y-Frame · 3 Motor · Tilt Servo Belakang</div>

<div class="diagram-container">
<svg class="schematic" viewBox="0 0 1104 700">
  <defs>
    <marker id="arrowG" markerWidth="6" markerHeight="4" refX="6" refY="2" orient="auto"><polygon points="0 0,6 2,0 4" fill="#94a3b8"/></marker>
    <!-- Motor symbols -->
    <g id="motor-ccw">
      <circle cx="0" cy="0" r="24" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2"/>
      <path d="M-8,-8 A 12 12 0 0 1 8,-8" stroke="#3B82F6" stroke-width="1.5" fill="none" marker-end="url(#arrowG)"/>
      <circle cx="0" cy="0" r="4" fill="#3B82F6"/>
    </g>
    <g id="motor-cw">
      <circle cx="0" cy="0" r="24" fill="#D1FAE5" stroke="#10B981" stroke-width="2"/>
      <path d="M8,-8 A 12 12 0 0 1 8,8" stroke="#10B981" stroke-width="1.5" fill="none" marker-end="url(#arrowG)"/>
      <circle cx="0" cy="0" r="4" fill="#10B981"/>
    </g>
    <g id="motor-servo">
      <circle cx="0" cy="0" r="24" fill="#FEE2E2" stroke="#EF4444" stroke-width="2"/>
      <path d="M8,-8 A 12 12 0 0 1 8,8" stroke="#EF4444" stroke-width="1.5" fill="none" marker-end="url(#arrowG)"/>
      <circle cx="0" cy="0" r="4" fill="#EF4444"/>
    </g>
  </defs>

  <!-- Background grid (subtle) -->
  <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
    <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#f1f5f9" stroke-width="0.5"/>
  </pattern>
  <rect width="1104" height="700" fill="url(#grid)"/>

  <!-- Center point -->
  <!-- Y-frame center at 552, 360 -->
  
  <!-- Frame arms -->
  <!-- Front-left arm: center to upper-left, 120° from right arm -->
  <!-- Front-right arm: center to upper-right -->
  <!-- Rear arm: center to bottom -->
  
  <!-- The Y frame: front arms at -30° and -150° from vertical, rear arm straight down -->
  <!-- Actually for a Y-frame tricopter: -->
  <!-- Front-left motor at ~240° (or -30° from left horizontal) -->
  <!-- Front-right motor at ~300° (or -30° from right horizontal) -->
  <!-- Rear motor at 90° (straight down) -->
  <!-- Let's use: front-left at 210°, front-right at 330°, rear at 90° -->
  
  <!-- Arm length: 200px -->
  <!-- Front-left motor: 552 + 200*cos(210°), 360 + 200*sin(210°) = 552-173, 360+100 = 379, 460 -->
  <!-- Wait, let me recalculate for a nice top-view Y shape -->
  <!-- Let's put the "front" at the top of the diagram -->
  <!-- Motor positions: -->
  <!-- Front-left: 552 - 180, 360 - 140 = 372, 220 -->
  <!-- Front-right: 552 + 180, 360 - 140 = 732, 220 -->
  <!-- Rear: 552, 360 + 200 = 552, 560 -->

  <!-- Frame body / arms -->
  <line x1="552" y1="360" x2="372" y2="220" stroke="#475569" stroke-width="6" stroke-linecap="round"/>
  <line x1="552" y1="360" x2="732" y2="220" stroke="#475569" stroke-width="6" stroke-linecap="round"/>
  <line x1="552" y1="360" x2="552" y2="560" stroke="#475569" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Front cross-bar between front motors -->
  <line x1="372" y1="220" x2="732" y2="220" stroke="#475569" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 4"/>
  
  <!-- Center hub -->
  <circle cx="552" cy="360" r="36" fill="#F8FAFC" stroke="#475569" stroke-width="2"/>

  <!-- Motor 1 - Front Left (CCW) -->
  <use href="#motor-ccw" x="372" y="220"/>
  <text x="372" y="178" text-anchor="middle" class="motor-label">Motor 1</text>
  <text x="372" y="192" text-anchor="middle" class="rotation-label">CCW — Berlawanan Jarum Jam</text>

  <!-- Motor 2 - Front Right (CW) -->
  <use href="#motor-cw" x="732" y="220"/>
  <text x="732" y="178" text-anchor="middle" class="motor-label">Motor 2</text>
  <text x="732" y="192" text-anchor="middle" class="rotation-label">CW — Searah Jarum Jam</text>

  <!-- Motor 3 - Rear (CW + Tilt Servo) -->
  <use href="#motor-servo" x="552" y="560"/>
  <text x="552" y="602" text-anchor="middle" class="motor-label">Motor 3</text>
  <text x="552" y="616" text-anchor="middle" class="rotation-label">CW + Tilt Servo MG90S</text>

  <!-- Tilt servo indicator -->
  <path d="M 576 560 Q 600 540 608 520" stroke="#EF4444" stroke-width="1.5" fill="none" stroke-dasharray="4 2" marker-end="url(#arrowG)"/>
  <text x="616" y="528" class="detail-label" fill="#EF4444">Yaw servo</text>

  <!-- Center labels -->
  <text x="552" y="354" text-anchor="middle" class="component-label" font-size="11">Pixhawk 4</text>
  <text x="552" y="370" text-anchor="middle" class="detail-label">Flight Controller</text>

  <!-- Companion Computer (offset right from center) -->
  <rect x="590" y="340" width="80" height="36" rx="4" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="630" y="356" text-anchor="middle" class="component-label" font-size="10">Companion</text>
  <text x="630" y="368" text-anchor="middle" class="detail-label" font-size="9">Raspberry Pi 4</text>

  <!-- Camera at front -->
  <rect x="530" y="120" width="44" height="30" rx="6" fill="#FDF2F8" stroke="#F9A8D4" stroke-width="1.5"/>
  <circle cx="552" cy="135" r="8" fill="#FCE7F3" stroke="#EC4899" stroke-width="1"/>
  <text x="552" y="112" text-anchor="middle" class="component-label">Kamera</text>
  <text x="552" y="100" text-anchor="middle" class="detail-label">FPV / Mission Cam</text>
  <!-- Camera line to frame -->
  <line x1="552" y1="150" x2="552" y2="196" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="3 2"/>

  <!-- GPS module on top -->
  <rect x="420" y="310" width="60" height="28" rx="4" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.5"/>
  <text x="450" y="328" text-anchor="middle" class="component-label" font-size="10">GPS</text>
  <text x="450" y="304" text-anchor="middle" class="detail-label">M8N Module</text>
  <line x1="480" y1="324" x2="516" y2="348" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="3 2"/>

  <!-- Floats / Landing gear -->
  <!-- Left float -->
  <rect x="280" y="440" width="50" height="14" rx="7" fill="#EEF2FF" stroke="#A5B4FC" stroke-width="1"/>
  <text x="305" y="466" text-anchor="middle" class="detail-label">Float L</text>
  <line x1="330" y1="447" x2="372" y2="220" stroke="#CBD5E1" stroke-width="0.8" stroke-dasharray="2 2"/>
  
  <!-- Right float -->
  <rect x="774" y="440" width="50" height="14" rx="7" fill="#EEF2FF" stroke="#A5B4FC" stroke-width="1"/>
  <text x="799" y="466" text-anchor="middle" class="detail-label">Float R</text>
  <line x1="774" y1="447" x2="732" y2="220" stroke="#CBD5E1" stroke-width="0.8" stroke-dasharray="2 2"/>
  
  <!-- Rear float -->
  <rect x="527" y="638" width="50" height="14" rx="7" fill="#EEF2FF" stroke="#A5B4FC" stroke-width="1"/>
  <text x="552" y="664" text-anchor="middle" class="detail-label">Float Rear</text>
  <line x1="552" y1="638" x2="552" y2="584" stroke="#CBD5E1" stroke-width="0.8" stroke-dasharray="2 2"/>

  <!-- Angle annotations -->
  <!-- 120° between each arm -->
  <path d="M 552 340 A 20 20 0 0 0 535 349" fill="none" stroke="#94a3b8" stroke-width="0.8"/>
  <text x="528" y="338" class="dim-label">120°</text>
  
  <path d="M 569 349 A 20 20 0 0 0 552 340" fill="none" stroke="#94a3b8" stroke-width="0.8"/>
  <text x="568" y="338" class="dim-label">120°</text>

  <!-- Arm length annotation -->
  <line x1="462" y1="290" x2="462" y2="230" stroke="#94a3b8" stroke-width="0.8"/>
  <line x1="372" y1="230" x2="462" y2="230" stroke="#94a3b8" stroke-width="0.8" stroke-dasharray="2 2"/>
  <line x1="462" y1="290" x2="552" y2="360" stroke="#94a3b8" stroke-width="0.8" stroke-dasharray="2 2"/>
  <text x="470" y="268" class="dim-label">~450mm</text>

  <!-- Legend -->
  <rect x="28" y="580" width="200" height="108" rx="8" fill="#f8f9fa" stroke="#E2E8F0" stroke-width="1"/>
  <text x="44" y="600" class="component-label" font-size="11">Legenda</text>
  
  <circle cx="52" cy="618" r="8" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="68" y="622" class="detail-label">Motor CCW</text>
  
  <circle cx="52" cy="640" r="8" fill="#D1FAE5" stroke="#10B981" stroke-width="1.5"/>
  <text x="68" y="644" class="detail-label">Motor CW</text>
  
  <circle cx="52" cy="662" r="8" fill="#FEE2E2" stroke="#EF4444" stroke-width="1.5"/>
  <text x="68" y="666" class="detail-label">Motor CW + Tilt Servo</text>

  <rect x="44" y="674" width="16" height="8" rx="4" fill="#EEF2FF" stroke="#A5B4FC" stroke-width="1"/>
  <text x="68" y="682" class="detail-label">Float / Landing Gear</text>

  <!-- Direction indicator -->
  <text x="552" y="68" text-anchor="middle" class="component-label" font-size="12" fill="#94a3b8">▲ DEPAN (Front)</text>

</svg>
</div>

</body>
</html>
